[tool.poetry]
name = "liora"
version = "0.1.0"
description = "LIORA: AI-powered, adaptive, memory-aware learning assistant"
authors = ["Liora Team"]

[tool.poetry.dependencies]
python = "^3.12"
streamlit = "^1.30.0"
groq = "^0.4.0"
python-dotenv = "^1.0.0"
pytest = "^8.0.0"
psycopg = {extras = ["binary", "pool"], version = "^3.1.18"}

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
