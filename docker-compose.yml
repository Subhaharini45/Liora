version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: liora
      POSTGRES_USER: liora_user
      POSTGRES_PASSWORD: liora_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liora_user -d liora"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Endee configuration to be added once API/contract is verified
  # endee:
  #   image: ???
  #   ports:
  #     - "???"

volumes:
  postgres_data:
